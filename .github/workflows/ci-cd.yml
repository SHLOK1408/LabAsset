name: LabAsset CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: flake8 app.py tests

      - name: Run Pytest
        run: pytest -v

  docker:
    name: Docker Build and Health Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t labasset .

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name labasset-container labasset

      - name: Wait for application
        run: sleep 5

      - name: Check application health
        run: curl --fail http://localhost:5000/health

      - name: Show container logs if needed
        if: failure()
        run: docker logs labasset-container